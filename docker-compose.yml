services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "dev-ecosync-secret"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      USE_FIRESTORE: "${USE_FIRESTORE:-0}"
      FIRESTORE_TRANSPORT: "${FIRESTORE_TRANSPORT:-rest}"
      FIREBASE_CREDENTIALS_FILE: "${FIREBASE_CREDENTIALS_FILE_DOCKER:-/workspace/ecosync-ai-8cfbc-firebase-adminsdk-fbsvc-5bbaff829f.json}"
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID:-}"
      FIREBASE_CLIENT_EMAIL: "${FIREBASE_CLIENT_EMAIL:-}"
      FIREBASE_PRIVATE_KEY: "${FIREBASE_PRIVATE_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.1-flash-lite}"
      REMEMBER_LLM_RESPONSES: "${REMEMBER_LLM_RESPONSES:-1}"
      ALLOW_PUBLIC_REGISTRATION: "${ALLOW_PUBLIC_REGISTRATION:-1}"
      DEFAULT_REGISTERED_USER_GROUP: "${DEFAULT_REGISTERED_USER_GROUP:-program_manager}"
      EMAIL_BACKEND: "${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}"
      EMAIL_HOST: "${EMAIL_HOST:-smtp.gmail.com}"
      EMAIL_PORT: "${EMAIL_PORT:-587}"
      EMAIL_USE_TLS: "${EMAIL_USE_TLS:-1}"
      EMAIL_ALLOW_INSECURE_TLS: "${EMAIL_ALLOW_INSECURE_TLS:-0}"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-EcoSync AI <noreply@ecosync.local>}"
    volumes:
      - ./backend:/app
      - ./:/workspace:ro

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:8000/api"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
